workflows:
  ios-release:
    name: Targetym AI - iOS Release v5
    max_build_duration: 60
    environment:
      groups:
        - ios-credentials
      vars:
        XCODE_WORKSPACE: "targetym-dashboard/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6804746218"
        BUNDLE_ID: "com.targetym.app"
      node: 20.18.0
    scripts:
      - name: Install dependencies
        script: |
          cd targetym-dashboard
          npm ci

      - name: Build Next.js (mobile)
        script: |
          cd targetym-dashboard
          BUILD_TARGET=mobile npm run build

      - name: Sync Capacitor iOS
        script: |
          cd targetym-dashboard
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd targetym-dashboard/ios/App
          pod install

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain initialize
          keychain add-certificates

      - name: Set version and build number
        script: |
          cd targetym-dashboard/ios/App
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo "0")
          BUILD_NUMBER=$((LATEST_BUILD + 1))
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version "1.0.8"

      - name: Build and archive
        script: |
          xcode-project use-profiles

          TEAM_ID=$(security find-identity -v -p codesigning | grep -oE '\([A-Z0-9]+\)' | head -1 | tr -d '()')
          echo "Team ID: $TEAM_ID"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH=$(find "$PROFILES_DIR" -name "*.mobileprovision" | head -1)
          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          echo "Profile UUID: $PROFILE_UUID"

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_PATH"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            -allowProvisioningUpdates

          rm -f /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_UUID" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool YES" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool NO" /tmp/ExportOptions.plist

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
