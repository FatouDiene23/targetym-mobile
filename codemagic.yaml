workflows:
  ios-release:
    name: Targetym AI - iOS Release
    max_build_duration: 60
    environment:
      groups:
        - ios-credentials
      vars:
        XCODE_WORKSPACE: "targetym-dashboard/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6804746218"
        BUNDLE_ID: "com.targetym.app"
      node: 20.18.0
    scripts:
      - name: Install dependencies
        script: |
          cd targetym-dashboard
          npm ci

      - name: Build Next.js (mobile)
        script: |
          cd targetym-dashboard
          BUILD_TARGET=mobile npm run build

      - name: Sync Capacitor iOS
        script: |
          cd targetym-dashboard
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd targetym-dashboard/ios/App
          pod install

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates

      - name: Set version and build number
        script: |
          cd targetym-dashboard/ios/App
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo "0")
          BUILD_NUMBER=$((LATEST_BUILD + 1))
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version "1.0.8"

      - name: Build and archive
        script: |
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist)
          echo "Profile UUID: $PROFILE_UUID | Team: $TEAM_ID"

          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_PATH"

          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID"

          cat > /tmp/ExportOptions.plist << EXPORTEOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>app-store</string>
    <key>teamID</key>
    <string>$TEAM_ID</string>
    <key>signingStyle</key>
    <string>manual</string>
    <key>provisioningProfiles</key>
    <dict>
        <key>$BUNDLE_ID</key>
        <string>$PROFILE_UUID</string>
    </dict>
    <key>uploadSymbols</key>
    <true/>
    <key>compileBitcode</key>
    <false/>
</dict>
</plist>
EXPORTEOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
